<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon Legends: Z-A - Interactive Map</title>

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css" />

    <!-- Leaflet JS (loaded before Editable) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Leaflet.Editable plugin -->
    <script src="https://unpkg.com/leaflet-editable@1.2.0/src/Leaflet.Editable.js"></script>

    <!-- Bundled App -->
    <script type="module" src="main.js" defer></script>
  </head>
  <body>
    <div class="container">
      <!-- Filter Sidebar -->
      <div class="sidebar">
        <h2>Filters</h2>

        <div class="filter-section">
          <h3>Map Features</h3>
          <label>
            <input type="checkbox" id="filter-spawners" checked />
            Pokemon Spawners
          </label>
          <label>
            <input type="checkbox" id="filter-benches" checked />
            Benches
          </label>
          <label>
            <input type="checkbox" id="filter-fly-points" checked />
            Fly Points
          </label>
          <label>
            <input type="checkbox" id="filter-holovators" checked />
            Holovators
          </label>
          <label>
            <input type="checkbox" id="filter-ladders" checked />
            Ladders
          </label>
          <label>
            <input type="checkbox" id="filter-wild-zones" checked />
            Wild Zone Markers
          </label>
          <label>
            <input type="checkbox" id="filter-wild-zone-boundaries" checked />
            Wild Zone Boundaries
          </label>
          <label>
            <input type="checkbox" id="filter-static-alphas" checked />
            Static Alphas
          </label>
        </div>

        <div class="filter-section">
          <h3>Pokemon Types</h3>
          <div id="type-filters">
            <!-- Will be populated dynamically -->
          </div>
        </div>

        <div class="filter-section">
          <h3>Search Pokemon</h3>
          <input
            type="text"
            id="pokemon-search"
            placeholder="Search by name..."
          />
        </div>

        <div class="filter-section boundary-edit-section">
          <h3>Boundary Editor</h3>
          <label>
            <input type="checkbox" id="enable-boundary-editing" />
            Enable Editing Mode
          </label>
          <div id="boundary-changes" style="margin-top: 12px; display: none;">
            <h4 style="margin: 0 0 8px 0; font-size: 13px;">Modified Boundaries</h4>
            <div id="boundary-changes-list" style="font-size: 11px; max-height: 200px; overflow-y: auto; background: #fafafa; padding: 8px; border-radius: 4px; margin-bottom: 8px;">
              No changes yet
            </div>
            <button id="copy-boundary-changes" style="width: 100%; padding: 6px; font-size: 12px; cursor: pointer;">
              Copy Changes as JSON
            </button>
            <button id="reset-boundary-changes" style="width: 100%; padding: 6px; font-size: 12px; cursor: pointer; margin-top: 4px;">
              Reset All Changes
            </button>
          </div>
        </div>

        <div class="filter-section debug-section">
          <h3>Debug</h3>
          <div class="zoom-display">
            Zoom: <span id="zoom-level">0</span>
          </div>

          <h4 style="margin-top: 16px; margin-bottom: 8px;">Coordinate Debug</h4>
          <div id="coord-debug-info" style="font-size: 10px; max-height: 400px; overflow-y: auto; background: #fafafa; padding: 8px; border-radius: 4px;">
            Loading...
          </div>
        </div>
      </div>

      <!-- Map Container -->
      <div id="map"></div>
    </div>

  </body>
</html>
