<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon Legends: Z-A - Interactive Map</title>

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css" />

    <!-- Bundled App -->
    <script type="module" src="main.js" defer></script>
  </head>
  <body>
    <div class="container">
      <!-- Filter Sidebar -->
      <div class="sidebar">
        <h2>Filters</h2>

        <div class="filter-section">
          <h3>Map Features</h3>
          <label>
            <input type="checkbox" id="filter-spawners" checked />
            Pokemon Spawners
          </label>
          <label>
            <input type="checkbox" id="filter-benches" checked />
            Benches
          </label>
          <label>
            <input type="checkbox" id="filter-fly-points" checked />
            Fly Points
          </label>
          <label>
            <input type="checkbox" id="filter-holovators" checked />
            Holovators
          </label>
          <label>
            <input type="checkbox" id="filter-ladders" checked />
            Ladders
          </label>
          <label>
            <input type="checkbox" id="filter-wild-zones" checked />
            Wild Zone Markers
          </label>
          <label>
            <input type="checkbox" id="filter-wild-zone-boundaries" checked />
            Wild Zone Boundaries
          </label>
          <label>
            <input type="checkbox" id="filter-static-alphas" checked />
            Static Alphas
          </label>
        </div>

        <div class="filter-section">
          <h3>Pokemon Types</h3>
          <div id="type-filters">
            <!-- Will be populated dynamically -->
          </div>
        </div>

        <div class="filter-section">
          <h3>Search Pokemon</h3>
          <input
            type="text"
            id="pokemon-search"
            placeholder="Search by name..."
          />
        </div>

        <div class="filter-section debug-section">
          <h3>Debug</h3>
          <div class="zoom-display">
            Zoom: <span id="zoom-level">0</span>
          </div>

          <h4 style="margin-top: 16px; margin-bottom: 8px;">Boundary Transform</h4>
          <div style="font-size: 12px; margin-bottom: 8px;">
            <label style="display: block; margin-bottom: 4px;">
              Lng Scale: <span id="lng-scale-value">0.2680</span>
            </label>
            <div style="display: flex; gap: 4px; align-items: center;">
              <button id="lng-scale-dec" style="width: 24px; padding: 2px; font-size: 14px;">-</button>
              <input
                type="range"
                id="lng-scale"
                min="0.2"
                max="0.35"
                step="0.0001"
                value="0.2680"
                style="flex: 1;"
              />
              <button id="lng-scale-inc" style="width: 24px; padding: 2px; font-size: 14px;">+</button>
            </div>
          </div>

          <div style="font-size: 12px; margin-bottom: 8px;">
            <label style="display: block; margin-bottom: 4px;">
              Lng Offset: <span id="lng-offset-value">-0.97</span>
            </label>
            <div style="display: flex; gap: 4px; align-items: center;">
              <button id="lng-offset-dec" style="width: 24px; padding: 2px; font-size: 14px;">-</button>
              <input
                type="range"
                id="lng-offset"
                min="-50"
                max="50"
                step="0.1"
                value="-0.97"
                style="flex: 1;"
              />
              <button id="lng-offset-inc" style="width: 24px; padding: 2px; font-size: 14px;">+</button>
            </div>
          </div>

          <div style="font-size: 12px; margin-bottom: 8px;">
            <label style="display: block; margin-bottom: 4px;">
              Lat Scale: <span id="lat-scale-value">-0.2683</span>
            </label>
            <div style="display: flex; gap: 4px; align-items: center;">
              <button id="lat-scale-dec" style="width: 24px; padding: 2px; font-size: 14px;">-</button>
              <input
                type="range"
                id="lat-scale"
                min="-0.35"
                max="-0.2"
                step="0.0001"
                value="-0.2683"
                style="flex: 1;"
              />
              <button id="lat-scale-inc" style="width: 24px; padding: 2px; font-size: 14px;">+</button>
            </div>
          </div>

          <div style="font-size: 12px; margin-bottom: 8px;">
            <label style="display: block; margin-bottom: 4px;">
              Lat Offset: <span id="lat-offset-value">1.41</span>
            </label>
            <div style="display: flex; gap: 4px; align-items: center;">
              <button id="lat-offset-dec" style="width: 24px; padding: 2px; font-size: 14px;">-</button>
              <input
                type="range"
                id="lat-offset"
                min="-100"
                max="100"
                step="0.1"
                value="1.41"
                style="flex: 1;"
              />
              <button id="lat-offset-inc" style="width: 24px; padding: 2px; font-size: 14px;">+</button>
            </div>
          </div>

          <button
            id="reset-transform"
            style="width: 100%; padding: 4px; margin-top: 8px; font-size: 11px;"
          >
            Reset to Calculated
          </button>
        </div>
      </div>

      <!-- Map Container -->
      <div id="map"></div>
    </div>

  </body>
</html>
